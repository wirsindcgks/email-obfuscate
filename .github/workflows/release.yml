# Ein gepushter Tag wie v1.2.0 wird zum Release: Tests, Versionsabgleich,
# Plugin-ZIP mit dem Ordner email-obfuscate/, Changelog aus der readme.txt.
# Die ZIP-Datei ist das Paket, das der Updater im Plugin installiert.
# Die Versionsnummer (Plugin-Header, readme.txt, ZIP-Name, Release-Titel)
# steht ohne v, nur der Tag traegt es. Tags bis 1.3.4 haben kein v.
#
# GitHub loest einen Tag-Push gelegentlich doppelt aus: concurrency laesst
# solche Laeufe nacheinander statt gleichzeitig laufen, und ein Lauf, der das
# Release schon vorfindet, endet ohne Fehler.
#
# Startet nach einem Tag-Push gar kein Lauf, hilft kein erneuter Push: Das
# Ruleset "Release-Tags – unantastbar" verbietet, Tags zu loeschen. Stattdessen
# den Lauf von Hand fuer den Tag starten: gh workflow run release.yml --ref v1.2.0
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Version aus dem Tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Auf einem Commit-SHA wie in ci.yml: Dieser Workflow darf schreiben und
      # baut die ZIP-Datei, die der Updater installiert.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests
        run: php tests/run.php

      - name: Version pruefen
        run: |
          [[ "$GITHUB_REF_NAME" == v* ]] || { echo "::error::Tag ${GITHUB_REF_NAME} beginnt nicht mit v"; exit 1; }
          grep -Eq "^ \* Version: +${VERSION}$" email-obfuscate.php || { echo "::error::Version im Plugin-Header ist nicht ${VERSION}"; exit 1; }
          grep -q "^Stable tag: ${VERSION}$" readme.txt || { echo "::error::Stable tag in readme.txt ist nicht ${VERSION}"; exit 1; }
          grep -q "^= ${VERSION} =$" readme.txt || { echo "::error::Kein Changelog-Eintrag fuer ${VERSION}"; exit 1; }

      - name: ZIP bauen
        run: git archive --format=zip --prefix=email-obfuscate/ -o "email-obfuscate-${VERSION}.zip" HEAD

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release ${GITHUB_REF_NAME} gibt es schon, nichts zu tun."
            exit 0
          fi
          awk -v head="= ${VERSION} =" '$0 == head { found = 1; next } /^= / { found = 0 } found' readme.txt > notes.md
          gh release create "$GITHUB_REF_NAME" "email-obfuscate-${VERSION}.zip" \
            --title "Email Obfuscate ${VERSION}" --notes-file notes.md --latest
